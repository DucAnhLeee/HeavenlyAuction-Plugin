# ======================================================================= #
#                  HEAVENLY AUCTION (VẠN BẢO LÂU)                         #
#          Hệ Thống Chợ Trời, Huyền Thưởng Lệnh & Đấu Giá Tu Tiên        #
# ======================================================================= #

# Cấu hình Chợ Trời (Vạn Bảo Lâu)
market:
  # Thời gian tồn tại của vật phẩm trên sàn trước khi tự đưa vào Càn Khôn Đãi (giây)
  # 604800 = 7 ngày
  expire-time-seconds: 604800
  # Giới hạn số lượng bảo vật tối đa một tu sĩ có thể niêm yết bán cùng lúc
  max-items-per-player: 10

# Cấu hình Tiền Tệ Hỗ Trợ & Thuế Sàn
# Hỗ trợ 3 loại:
# 1. eco -> Vault (Bạc)
# 2. points -> PlayerPoints (Linh Thạch)
# 3. xuhethong -> CoinsEngine (Xu Hệ Thống)
currencies:
  eco:
    display-name: "&aBạc"
    # Thuế khấu trừ khi bán thành công (%)
    tax-percent: 10.0
    coinsengine-currency: "vault"
  points:
    display-name: "&bLinh Thạch"
    tax-percent: 5.0
    coinsengine-currency: "playerpoints"
  xuhethong:
    display-name: "&6Xu Hệ Thống"
    tax-percent: 8.0
    coinsengine-currency: "xuhethong"

# Cấu hình Huyền Thưởng Lệnh (Người chơi treo thưởng cho người chơi)
bounties:
  # Thời gian tồn tại của lệnh treo thưởng trước khi hoàn trả (giây)
  expire-time-seconds: 604800
  # Giới hạn số đơn treo thưởng tối đa một người có thể phát cùng lúc
  max-bounties-per-player: 5

# Cấu hình Đấu Giá Bảo Vật (Người chơi & Hệ thống)
auctions:
  # Thời lượng mặc định cho phiên đấu giá do người chơi mở (giây)
  default-duration-seconds: 300
  # Bước giá đấu tối thiểu cộng thêm cho lượt ra giá tiếp theo
  min-bid-step: 100.0
  # Thuế sàn đấu giá (%)
  tax-percent: 5.0

# Cấu hình Đấu Giá Tự Động Của Hệ Thống (Server Scheduled Auctions)
server-auctions:
  enabled: true
  # Tần suất tự động mở phiên đấu giá mới (phút). Mặc định: 180 phút = 3 giờ
  interval-minutes: 180
  # Thời gian diễn ra phiên đấu giá (giây)
  duration-seconds: 300

  # Khung giờ xuất hiện "Cổ Vật Ẩn Vị" (Mystery Item) hàng ngày (Định dạng HH:mm)
  # Đúng 20:00 (8 giờ tối) hàng ngày sẽ phát động phiên đấu giá bí ẩn đặc biệt!
  mystery-time: "20:00"

  # Giao diện hiển thị của Cổ Vật Ẩn Vị (Thông tin thật chỉ lộ diện khi thắng đấu giá)
  mystery-item:
    name: "&d&l!? CỔ VẬT CHƯA GIÁM ĐỊNH"
    material: ECHO_SHARD
    lore:
      - "&8&m----------------------------------------"
      - "&5&l[Huyền Bí] &dCổ Vật Thượng Cổ Chưa Giám Định"
      - "&7Một luồng khí tức Thượng Cổ hỗn mang tỏa ra dị tượng..."
      - "&7Bên trong phong ấn pháp tắc thiên địa vô cùng huyền ảo."
      - "&6Chỉ kẻ chiến thắng phiên đấu giá mới có thể"
      - "&6phá giải phong ấn và chứng kiến chân diện mục!"
      - "&8&m----------------------------------------"

  # Kho báu vật phẩm ngẫu nhiên của Hệ Thống
  items:
    item_dan_duoc:
      name: "&6&l[Thần Đan] &eCửu Chuyển Kim Đan"
      material: POTION
      amount: 1
      starting-price: 50000.0
      min-bid-step: 5000.0
      currency: "eco"
      lore:
        - "&7Đan dược nghịch thiên cải mệnh."
        - "&eTăng 1000 điểm tu vi lập tức!"
    item_linh_thach_dai:
      name: "&b&l[Cực Phẩm] &bKhối Hạch Linh Thạch"
      material: AMETHYST_CLUSTER
      amount: 1
      starting-price: 200.0
      min-bid-step: 20.0
      currency: "points"
      lore:
        - "&7Chứa đựng tinh hoa đất trời thuần khiết."
    item_bi_kip_kiem:
      name: "&c&l[Tuyệt Kỹ] &cThái Hư Kiếm Quyết"
      material: ENCHANTED_BOOK
      amount: 1
      starting-price: 500.0
      min-bid-step: 50.0
      currency: "xuhethong"
      lore:
        - "&7Bí tịch kiếm đạo vô thượng."
    # Vật phẩm dùng làm Cổ Vật Ẩn Vị (sẽ hiển thị dạng ẩn nếu xuất hiện lúc 20:00)
    mystery_than_binh:
      name: "&4&l[Thần Khí] &cHiên Viên Kiếm"
      material: NETHERITE_SWORD
      amount: 1
      starting-price: 100000.0
      min-bid-step: 10000.0
      currency: "eco"
      is-mystery: true
      lore:
        - "&eBảo kiếm chém đứt luân hồi, kinh thiên động địa!"

# Cấu hình Càn Khôn Đãi (Hòm Thư Tín & Lưu Trữ Cá Nhân)
mailbox:
  # Giới hạn số lượng bảo vật tối đa trong hòm thư của một tu sĩ
  max-items-per-player: 50

# Hệ Thống Lưu Giữ Dữ Liệu Chuyên Nghiệp & Chống Tràn Bộ Nhớ (Data Retention)
data-retention:
  # Tự động dọn dẹp các thư đã nhận và các bản ghi lịch sử cũ quá số ngày quy định
  retention-days: 30
  # Khoảng thời gian chạy tiến trình dọn dẹp và nén cơ sở dữ liệu SQLite (phút)
  cleanup-interval-minutes: 60
